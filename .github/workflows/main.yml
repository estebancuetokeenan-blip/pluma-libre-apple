name: Build Pluma Libre iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync config files into iOS project
        run: npx cap sync ios

      - name: Set export compliance (no non-exempt encryption)
        run: |
          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" \
            ios/App/App/Info.plist \
          || /usr/libexec/PlistBuddy \
            -c "Set :ITSAppUsesNonExemptEncryption false" \
            ios/App/App/Info.plist

      - name: Patch Podfile to disable Pod code signing
        run: |
          python3 -c "
          with open('ios/App/Podfile', 'r') as f:
              content = f.read()
          patch = '''
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              end
            end
          '''
          content = content.replace('post_install do |installer|', 'post_install do |installer|\n' + patch)
          with open('ios/App/Podfile', 'w') as f:
              f.write(content)
          print('Podfile patched')
          "

      - name: Import Apple certificate into keychain
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASS }}

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          echo "$PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /tmp/profile.plist)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Patch Xcode project with signing settings
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<PYEOF
          import re, os
          team_id = os.environ['TEAM_ID']
          profile_uuid = os.environ['PROFILE_UUID']
          f = 'ios/App/App.xcodeproj/project.pbxproj'
          with open(f) as fp:
              c = fp.read()
          c = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', f'DEVELOPMENT_TEAM = {team_id};', c)
          c = re.sub(r'CODE_SIGN_STYLE = \w+;', 'CODE_SIGN_STYLE = Manual;', c)
          c = re.sub(r'PROVISIONING_PROFILE = "[^"]*";', f'PROVISIONING_PROFILE = "{profile_uuid}";', c)
          c = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";', f'PROVISIONING_PROFILE_SPECIFIER = "{profile_uuid}";', c)
          with open(f, 'w') as fp:
              fp.write(c)
          print(f'Patched: team={team_id} profile={profile_uuid}')
          PYEOF

      - name: Install CocoaPods dependencies
        run: cd ios/App && pod install

      - name: Build and archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          CERT_NAME="Apple Distribution: Esteban Cueto ($TEAM_ID)"
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath ../../build/PlumaLibre.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CERT_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            -allowProvisioningUpdates

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.edicionescueto.plumalibr</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/PlumaLibre.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight via Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          cat > /tmp/asc_key.json << JSON
          {
            "key_id": "$ASC_KEY_ID",
            "issuer_id": "$ASC_ISSUER_ID",
            "key": "$ASC_PRIVATE_KEY_B64",
            "in_house": false,
            "is_key_content_base64": true
          }
          JSON
          fastlane pilot upload \
            --api_key_path /tmp/asc_key.json \
            --ipa "$(ls build/ipa/*.ipa)" \
            --skip_waiting_for_build_processing true
          rm /tmp/asc_key.json

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pluma-libre-ios
          path: build/ipa/*.ipa
          if-no-files-found: error
